<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>My Firebase Store</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
header{background:#111827;padding:15px;display:flex;justify-content:space-between}
.container{padding:20px}
.card{background:#1f2937;padding:15px;margin:10px 0;border-radius:12px}
input,button{width:95%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{background:#3b82f6;color:white;cursor:pointer}
.hidden{display:none}
.small{font-size:12px;color:#aaa}
</style>

</head>

<body>

<header>
<h3>My Store</h3>
<div>
<button onclick="show('login')">Login</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('orders')">Orders</button>
<button onclick="show('admin')">Admin</button>
</div>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login">
<div class="card">
<h3>Login / Signup</h3>
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- SHOP -->
<div id="shop" class="hidden">
<h2>Products</h2>
<div id="products"></div>
</div>

<!-- ORDERS -->
<div id="orders" class="hidden">
<h2>My Orders</h2>
<div id="myOrders"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden">
<h2>Admin Panel</h2>
<div id="adminOrders"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase,
ref,
push,
set,
onValue,
update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* 🔥 Firebase Config */
const firebaseConfig = {
  apiKey: "AIzaSyCC3jjKBVt_XBU_p_UoqjXQenpGnbZzxe8",
  authDomain: "my-store-7ef38.firebaseapp.com",
  databaseURL: "https://my-store-7ef38-default-rtdb.firebaseio.com",
  projectId: "my-store-7ef38",
  storageBucket: "my-store-7ef38.appspot.com",
  messagingSenderId: "732533225869",
  appId: "1:732533225869:web:74a9cb860d566e406fa5c4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let currentUser = null;

/* NAV */
window.show = (page) => {
["login","shop","orders","admin"].forEach(id=>{
let el=document.getElementById(id);
if(el) el.classList.add("hidden");
});
document.getElementById(page).classList.remove("hidden");
};

/* SIGNUP */
window.signup = async () => {
try{
const email = document.getElementById("email").value;
const pass = document.getElementById("pass").value;

await createUserWithEmailAndPassword(auth,email,pass);
alert("Account created");
}catch(e){alert(e.message);}
};

/* LOGIN */
window.login = async () => {
try{
const email = document.getElementById("email").value;
const pass = document.getElementById("pass").value;

await signInWithEmailAndPassword(auth,email,pass);
alert("Login success");
}catch(e){alert(e.message);}
};

/* AUTH */
onAuthStateChanged(auth,(user)=>{
if(user){
currentUser=user;
show("shop");
loadProducts();
loadOrders();
loadAdminOrders();
}else{
show("login");
}
});

/* PRODUCTS */
function loadProducts(){
onValue(ref(db,"products"),(snap)=>{
let data=snap.val();
let html="";

if(data){
for(let id in data){
html+=`
<div class="card">
<b>${data[id].name}</b><br>
Price: $${data[id].price}
<button onclick="buy('${data[id].name}')">Buy</button>
</div>`;
}
}else{
html="<p>No products</p>";
}

document.getElementById("products").innerHTML=html;
});
}

/* BUY */
window.buy = (name) => {
let o = push(ref(db,"orders"));
set(o,{
product:name,
user:currentUser.email,
status:"pending",
time:Date.now()
});
alert("Order placed");
};

/* ORDERS */
function loadOrders(){
onValue(ref(db,"orders"),(snap)=>{
let data=snap.val();
let html="";

if(data){
for(let id in data){
if(data[id].user===currentUser.email){
html+=`
<div class="card">
<b>${data[id].product}</b><br>
Status: ${data[id].status}
</div>`;
}
}
}

document.getElementById("myOrders").innerHTML=html;
});
}

/* ADMIN */
function loadAdminOrders(){
onValue(ref(db,"orders"),(snap)=>{
let data=snap.val();
let html="";

if(data){
for(let id in data){
html+=`
<div class="card">
<b>${data[id].user}</b><br>
${data[id].product}<br>
Status: ${data[id].status}<br>
<button onclick="updateOrder('${id}','approved')">Approve</button>
</div>`;
}
}

document.getElementById("adminOrders").innerHTML=html;
});
}

/* UPDATE */
window.updateOrder = (id,status) => {
update(ref(db,"orders/"+id),{
status:status
});
};

</script>

</body>
</html>
