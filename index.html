<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Step 4 Store</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
header{background:#111827;padding:15px;display:flex;justify-content:space-between}
.container{padding:20px}
.card{background:#1f2937;padding:15px;margin:10px 0;border-radius:12px}
input,button,select{width:95%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{background:#3b82f6;color:white;cursor:pointer}
.hidden{display:none}
.badge{background:red;padding:3px 8px;border-radius:20px;font-size:12px}
.small{font-size:12px;color:#aaa}
</style>
</head>

<body>

<header>
<h3>Step 4 Store</h3>
<div>
<button onclick="show('login')">Login</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('orders')">Orders <span id="notif" class="badge hidden">!</span></button>
<button onclick="show('admin')">Admin</button>
</div>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login">
<div class="card">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- SHOP -->
<div id="shop" class="hidden">
<h2>Products</h2>
<div id="products"></div>
</div>

<!-- ORDERS -->
<div id="orders" class="hidden">
<h2>My Orders</h2>
<div id="myOrders"></div>
</div>

<!-- CHAT -->
<div id="chat" class="hidden">
<h2>Order Chat</h2>
<div id="chatBox" class="card"></div>
<input id="msg" placeholder="Message">
<button onclick="sendMsg()">Send</button>
<button onclick="back()">Back</button>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden">
<h2>Admin Panel</h2>

<div class="card">
<h3>Add Product</h3>
<input id="pname" placeholder="Name">
<input id="pprice" placeholder="Price">
<button onclick="addProduct()">Add</button>
</div>

<h3>Orders</h3>
<div id="adminOrders"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth, createUserWithEmailAndPassword,
signInWithEmailAndPassword, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase, ref, push, set, onValue, update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCC3jjKBVt_XBU_p_UoqjXQenpGnbZzxe8",
  authDomain: "my-store-7ef38.firebaseapp.com",
  databaseURL: "https://my-store-7ef38-default-rtdb.firebaseio.com",
  projectId: "my-store-7ef38",
  storageBucket: "my-store-7ef38.appspot.com",
  messagingSenderId: "732533225869",
  appId: "1:732533225869:web:74a9cb860d566e406fa5c4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let role="customer";
let currentOrder=null;

/* NAV */
window.show=(v)=>{
["login","shop","orders","admin","chat"].forEach(i=>{
let el=document.getElementById(i);
if(el)el.classList.add("hidden");
});
document.getElementById(v).classList.remove("hidden");
}

/* AUTH */
window.login = async () => {
  try {
    await signInWithEmailAndPassword(
      auth,
      document.getElementById("email").value,
      document.getElementById("pass").value
    );
    alert("Login success");
  } catch (e) {
    alert(e.message);
  }
};

window.login=()=>{
signInWithEmailAndPassword(auth,email.value,pass.value);
}

/* ROLE */
onAuthStateChanged(auth,(user)=>{
if(user){
role = user.email==="admin@gmail.com" ? "admin" : "customer";
show("shop");
loadProducts();
loadOrders();
loadAdminOrders();
}
});

/* PRODUCTS */
function loadProducts(){
onValue(ref(db,"products"),snap=>{
let data=snap.val();
let html="";

for(let id in data){
html+=`
<div class="card">
<b>${data[id].name}</b> - $${data[id].price}
<button onclick="buy('${data[id].name}')">Buy</button>
</div>`;
}

document.getElementById("products").innerHTML=html;
});
}

/* BUY */
window.buy=(name)=>{
let o=push(ref(db,"orders"));
set(o,{
product:name,
user:auth.currentUser.email,
status:"pending",
time:Date.now()
});
}

/* ORDERS */
function loadOrders(){
onValue(ref(db,"orders"),snap=>{
let data=snap.val();
let html="";
let hasUpdate=false;

for(let id in data){
if(data[id].user===auth.currentUser.email){

if(data[id].status!=="pending") hasUpdate=true;

html+=`
<div class="card">
<b>${data[id].product}</b><br>
Status: ${data[id].status}<br>
<span class="small">${new Date(data[id].time).toLocaleString()}</span>
<br>
<button onclick="openChat('${id}')">Chat</button>
</div>`;
}
}

document.getElementById("myOrders").innerHTML=html;

if(hasUpdate){
document.getElementById("notif").classList.remove("hidden");
}
});
}

/* CHAT */
window.openChat=(id)=>{
currentOrder=id;
show("chat");
loadChat();
}

/* CHAT LOAD */
function loadChat(){
onValue(ref(db,"messages/"+currentOrder),snap=>{
let data=snap.val();
let html="";

for(let id in data){
let cls=data[id].from==="admin"?"adminc":"me";
html+=`<div class="msg ${cls}">${data[id].from}: ${data[id].text}</div>`;
}

document.getElementById("chatBox").innerHTML=html;
});
}

/* SEND */
window.sendMsg=()=>{
push(ref(db,"messages/"+currentOrder),{
text:msg.value,
from:role
});
msg.value="";
}

/* ADMIN */
window.addProduct=()=>{
if(role!=="admin")return;

push(ref(db,"products"),{
name:pname.value,
price:pprice.value
});
}

/* ADMIN ORDERS */
function loadAdminOrders(){
onValue(ref(db,"orders"),snap=>{
let data=snap.val();
let html="";

for(let id in data){
html+=`
<div class="card">
<b>${data[id].product}</b><br>
User: ${data[id].user}<br>

<select onchange="updateStatus('${id}',this.value)">
<option>pending</option>
<option>processing</option>
<option>shipped</option>
<option>delivered</option>
</select>

</div>`;
}

document.getElementById("adminOrders").innerHTML=html;
});
}

/* UPDATE STATUS */
window.updateStatus=(id,status)=>{
update(ref(db,"orders/"+id),{status});
}

show("login");

</script>

</body>
</html>
