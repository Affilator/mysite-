<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Smart Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #111;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .price {
      color: green;
      font-weight: bold;
      margin: 10px 0;
    }

    button {
      background: black;
      color: white;
      padding: 10px;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #111;
      color: white;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>🔥 My Smart Product Store</h1>
  <p>Buy Digital & Physical Products Easily</p>
</header>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="product">
    <h3>Product 1</h3>
    <p class="price">$10</p>
    <button onclick="buy()">Buy Now</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300" alt="product">
    <h3>Product 2</h3>
    <p class="price">$20</p>
    <button onclick="buy()">Buy Now</button>
  </div>

</div>

<footer>
  © 2026 My Store | All rights reserved
</footer>

<script>
function buy() {
  alert("Order system not connected yet. You can add WhatsApp or Stripe later.");
}
</script>

</body>
</html>
