<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pro Store</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

header {
  background: #111;
  color: white;
  padding: 15px;
  text-align: center;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 30px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: green;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  background: black;
  color: white;
  cursor: pointer;
  margin-top: 10px;
}

button:hover {
  background: #333;
}
</style>
</head>

<body>

<header>
  <h1>🔥 My Pro Store</h1>
  <p>Order instantly with PayPal</p>
</header>

<div class="products" id="products"></div>

<script>
// ==============================
// 👇 PRODUCTS (تو اینجا اضافه کن)
// ==============================
const products = [
  {
    name: "Gaming Headphones",
    price: 25,
    image: "https://images.unsplash.com/photo-1585386959984-a41552231693"
  },
  {
    name: "Smart Watch",
    price: 40,
    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30"
  },
  {
    name: "Wireless Mouse",
    price: 15,
    image: "https://images.unsplash.com/photo-1581291518857-4e27b48ff24e"
  }
];

// ==============================
// render products
// ==============================
const container = document.getElementById("products");

products.forEach(p => {
  container.innerHTML += `
    <div class="card">
      <img src="${p.image}">
      <div class="card-content">
        <h3>${p.name}</h3>
        <p class="price">$${p.price}</p>

        <button onclick="buy('${p.name}', ${p.price})">
          Buy with PayPal
        </button>
      </div>
    </div>
  `;
});

// ==============================
// PAYPAL CHECKOUT
// ==============================
function buy(name, price) {
  let businessEmail = "your-paypal-email@example.com"; // 👈 اینجا ایمیل PayPal خودت را بگذار

  let url =
  "https://www.paypal.com/cgi-bin/webscr?cmd=_xclick" +
  "&business=" + businessEmail +
  "&item_name=" + encodeURIComponent(name) +
  "&amount=" + price +
  "&currency_code=USD";

  window.open(url, "_blank");
}
</script>

</body>
</html>
