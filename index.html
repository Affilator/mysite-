<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Elite Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

/* HEADER */
header {
  background: #111;
  color: white;
  padding: 15px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  margin: 0;
}

.cart {
  background: #00c853;
  padding: 8px 12px;
  border-radius: 5px;
  cursor: pointer;
}

/* HERO */
.hero {
  background: linear-gradient(to right, #222, #444);
  color: white;
  text-align: center;
  padding: 60px 20px;
}

.hero h2 {
  font-size: 35px;
}

/* PRODUCTS */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 30px;
}

.card {
  background: white;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 3px 15px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 180px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: green;
  font-weight: bold;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  background: black;
  color: white;
  cursor: pointer;
  margin-top: 10px;
  border-radius: 6px;
}

button:hover {
  background: #333;
}

/* CART BOX */
.cart-box {
  position: fixed;
  right: 10px;
  top: 70px;
  background: white;
  padding: 15px;
  width: 250px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  display: none;
}
</style>
</head>

<body>

<header>
  <h1>Elite Shop</h1>
  <div class="cart" onclick="toggleCart()">
    Cart 🛒 (<span id="count">0</span>)
  </div>
</header>

<div class="hero">
  <h2>Order Your Favorite Products Online</h2>
  <p>Click buy → we deliver</p>
</div>

<!-- PRODUCTS -->
<div class="products">

  <div class="card">
    <img src="https://images.unsplash.com/photo-1585386959984-a41552231693">
    <div class="card-content">
      <h3>Headphones</h3>
      <p class="price">$25</p>
      <button onclick="addToCart('Headphones', 25)">Add to Cart</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30">
    <div class="card-content">
      <h3>Smart Watch</h3>
      <p class="price">$40</p>
      <button onclick="addToCart('Smart Watch', 40)">Add to Cart</button>
    </div>
  </div>

  <div class="card">
    <img src="https://images.unsplash.com/photo-1581291518857-4e27b48ff24e">
    <div class="card-content">
      <h3>Gaming Mouse</h3>
      <p class="price">$15</p>
      <button onclick="addToCart('Gaming Mouse', 15)">Add to Cart</button>
    </div>
  </div>

</div>

<!-- CART BOX -->
<div class="cart-box" id="cartBox">
  <h3>Your Order</h3>
  <div id="cartItems"></div>
  <br>
  <button onclick="checkout()">Order via WhatsApp</button>
</div>

<script>
let cart = [];

function addToCart(name, price) {
  cart.push({name, price});
  document.getElementById("count").innerText = cart.length;
  alert(name + " added to cart");
}

function toggleCart() {
  let box = document.getElementById("cartBox");
  box.style.display = box.style.display === "block" ? "none" : "block";
  renderCart();
}

function renderCart() {
  let html = "";
  let total = 0;

  cart.forEach(item => {
    html += `<p>${item.name} - $${item.price}</p>`;
    total += item.price;
  });

  html += `<hr><b>Total: $${total}</b>`;
  document.getElementById("cartItems").innerHTML = html;
}

function checkout() {
  let message = "Hello, I want to order:%0A";

  cart.forEach(item => {
    message += "- " + item.name + " $" + item.price + "%0A";
  });

  let phone = "93700000000"; // 👈 اینجا شماره واتساپ خودت را بگذار
  let url = "https://wa.me/" + phone + "?text=" + message;

  window.open(url, "_blank");
}
</script>

</body>
</html>
