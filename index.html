<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Step 2 Store</title>

<style>
body{margin:0;font-family:Arial;background:#0b1220;color:white}
header{background:#111827;padding:15px;display:flex;justify-content:space-between}
.container{padding:20px}
.card{background:#1f2937;padding:15px;margin:10px 0;border-radius:12px}
input,button{width:95%;padding:10px;margin:5px 0;border-radius:8px;border:none}
button{background:#3b82f6;color:white;cursor:pointer}
.hidden{display:none}
</style>
</head>

<body>

<header>
<h3>Store Step 2</h3>
<div>
<button onclick="show('login')">Login</button>
<button onclick="show('shop')">Shop</button>
<button onclick="show('orders')">Orders</button>
<button onclick="show('admin')">Admin</button>
</div>
</header>

<div class="container">

<!-- LOGIN -->
<div id="login">
<div class="card">
<h3>Login</h3>
<input id="email" placeholder="Email">
<input id="pass" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
</div>
</div>

<!-- SHOP -->
<div id="shop" class="hidden">
<h2>Products</h2>
<div id="products"></div>
</div>

<!-- ORDERS (CUSTOMER) -->
<div id="orders" class="hidden">
<h2>My Orders</h2>
<div id="myOrders"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden">
<h2>Admin Panel</h2>

<div class="card">
<h3>Add Product</h3>
<input id="pname" placeholder="Name">
<input id="pprice" placeholder="Price">
<button onclick="addProduct()">Add</button>
</div>

<h3>All Orders</h3>
<div id="adminOrders"></div>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
getAuth, createUserWithEmailAndPassword,
signInWithEmailAndPassword, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
getDatabase, ref, push, set, onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCC3jjKBVt_XBU_p_UoqjXQenpGnbZzxe8",
  authDomain: "my-store-7ef38.firebaseapp.com",
  databaseURL: "https://my-store-7ef38-default-rtdb.firebaseio.com",
  projectId: "my-store-7ef38",
  storageBucket: "my-store-7ef38.appspot.com",
  messagingSenderId: "732533225869",
  appId: "1:732533225869:web:74a9cb860d566e406fa5c4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);

let role="customer";

/* NAV */
window.show=(v)=>{
["login","shop","orders","admin"].forEach(i=>document.getElementById(i).classList.add("hidden"));
document.getElementById(v).classList.remove("hidden");
}

/* AUTH */
window.signup=()=>{
createUserWithEmailAndPassword(auth,email.value,pass.value);
}

window.login=()=>{
signInWithEmailAndPassword(auth,email.value,pass.value);
}

/* ROLE */
onAuthStateChanged(auth,(user)=>{
if(user){
role = user.email==="admin@gmail.com" ? "admin" : "customer";
show("shop");
loadProducts();
loadOrders();
loadAdminOrders();
}
});

/* ADD PRODUCT */
window.addProduct=()=>{
if(role!=="admin")return;

push(ref(db,"products"),{
name:pname.value,
price:pprice.value
});
}

/* LOAD PRODUCTS */
function loadProducts(){
onValue(ref(db,"products"),snap=>{
let data=snap.val();
let html="";

for(let id in data){
html+=`
<div class="card">
<b>${data[id].name}</b> - $${data[id].price}
<button onclick="buy('${data[id].name}','${data[id].price}')">Buy</button>
</div>`;
}

document.getElementById("products").innerHTML=html;
});
}

/* BUY → CREATE ORDER */
window.buy=(name,price)=>{
let order=push(ref(db,"orders"));
set(order,{
product:name,
price:price,
user:auth.currentUser.email,
status:"pending"
});
}

/* CUSTOMER ORDERS */
function loadOrders(){
onValue(ref(db,"orders"),snap=>{
let data=snap.val();
let html="";

for(let id in data){
if(data[id].user===auth.currentUser.email){
html+=`
<div class="card">
${data[id].product} - $${data[id].price}<br>
Status: ${data[id].status}
</div>`;
}
}

document.getElementById("myOrders").innerHTML=html;
});
}

/* ADMIN ORDERS */
function loadAdminOrders(){
onValue(ref(db,"orders"),snap=>{
let data=snap.val();
let html="";

for(let id in data){
html+=`
<div class="card">
${data[id].product} - ${data[id].user}<br>
Status: ${data[id].status}
</div>`;
}

document.getElementById("adminOrders").innerHTML=html;
});
}

show("login");

</script>

</body>
</html>
