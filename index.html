<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHAN STORE</title>

<style>
body{
margin:0;
font-family:Arial;
background:#0f0f0f;
color:white;
}

/* SIDEBAR */
#sidebar{
position:fixed;
left:0;
top:0;
width:220px;
height:100%;
background:#111;
padding:20px;
}

#sidebar h2{
color:#00ffae;
margin-bottom:20px;
}

#sidebar button{
width:100%;
padding:10px;
margin:8px 0;
background:#222;
color:white;
border:none;
cursor:pointer;
border-radius:6px;
}

#sidebar button:hover{
background:#00ffae;
color:black;
}

/* MAIN */
#main{
margin-left:240px;
padding:20px;
}

/* PRODUCTS */
#products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:#1a1a1a;
border-radius:10px;
overflow:hidden;
}

.card img{
width:100%;
height:180px;
object-fit:cover;
}

.card-content{
padding:10px;
}

.price{
color:#00ffae;
}

.buy-btn{
width:100%;
padding:10px;
border:none;
background:#00ffae;
cursor:pointer;
}

input{
width:100%;
padding:10px;
margin:5px 0;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div id="sidebar">
<h2>KHAN PANEL</h2>
<button onclick="showProducts()">🛍 Products</button>
<button onclick="showAdmin()">➕ Add Product</button>
<button onclick="showOrders()">📦 Orders</button>
<button onclick="showSettings()">⚙️ Settings</button>
</div>

<!-- MAIN -->
<div id="main">
<h1>Welcome to KHAN STORE</h1>
<div id="products"></div>
</div>

<!-- FIREBASE + JS -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCC3jjKBVt_XBU_p_UoqjXQenpGnbZzxe8",
  authDomain: "my-store-7ef38.firebaseapp.com",
  projectId: "my-store-7ef38",
  storageBucket: "my-store-7ef38.firebasestorage.app",
  messagingSenderId: "732533225869",
  appId: "1:732533225869:web:74a9cb860d566e406fa5c4",
  measurementId: "G-4BQ5TX5S19"
};

/* INIT */
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* BUY PRODUCT */
window.buyProduct = async function(name, price){

await addDoc(collection(db,"orders"),{
name,
price,
time: new Date()
});

alert("Order Saved!");
};

/* LOAD PRODUCTS */
async function loadProducts(){

const box = document.getElementById("products");
box.innerHTML = "";

const data = await getDocs(collection(db,"products"));

data.forEach((doc)=>{
let p = doc.data();

box.innerHTML += `
<div class="card">
<img src="${p.image}">
<div class="card-content">

<h3>${p.name}</h3>
<p class="price">$${p.price}</p>

<button class="buy-btn" onclick="buyProduct('${p.name}','${p.price}')">
Buy
</button>

</div>
</div>
`;
});
}

/* PAGES */
window.showProducts = function(){
document.getElementById("main").innerHTML = `
<h2>Products</h2>
<div id="products"></div>
`;
loadProducts();
};

window.showAdmin = function(){
document.getElementById("main").innerHTML = `
<h2>Add Product</h2>

<input id="name" placeholder="Name">
<input id="price" placeholder="Price">
<input id="image" placeholder="Image URL">

<button onclick="addProduct()">Save</button>
`;
};

window.addProduct = async function(){

await addDoc(collection(db,"products"),{
name: document.getElementById("name").value,
price: document.getElementById("price").value,
image: document.getElementById("image").value
});

alert("Product Added!");
showProducts();
};

window.showOrders = function(){
document.getElementById("main").innerHTML = "<h2>Orders Coming Soon</h2>";
};

window.showSettings = function(){
document.getElementById("main").innerHTML = "<h2>Settings Coming Soon</h2>";
};

/* START */
showProducts();

</script>

</body>
</html>
