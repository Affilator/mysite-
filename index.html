<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple Store</title>
<style>
body { font-family: Arial; margin: 0; background:#f4f4f4; }

header { background:#222; color:white; padding:10px; display:flex; justify-content:space-between; }

.container { padding:20px; }

.hidden { display:none; }

.card { background:white; padding:10px; margin:10px; border-radius:8px; }

button { padding:5px 10px; margin-top:5px; cursor:pointer; }

input { padding:5px; margin:5px; width:90%; }

#adminPanel { background:#fff; padding:15px; margin-top:10px; }

</style>
</head>
<body>

<header>
<h3>My Store</h3>
<div>
<button onclick="showShop()">Shop</button>
<button onclick="showAdmin()">Admin</button>
</div>
</header>

<div class="container">

<!-- SHOP -->
<div id="shop">
<h2>Products</h2>
<div id="productList"></div>

<h3>Cart</h3>
<div id="cart"></div>
</div>

<!-- ADMIN -->
<div id="admin" class="hidden">
<h2>Admin Dashboard</h2>

<div id="adminPanel">
<h3>Add Product</h3>
<input id="pname" placeholder="Product Name">
<input id="pprice" placeholder="Price">
<button onclick="addProduct()">Add Product</button>
</div>

<h3>All Products</h3>
<div id="adminProducts"></div>
</div>

</div>

<script>

let products = [];
let cart = [];

// Show shop
function showShop(){
document.getElementById("shop").classList.remove("hidden");
document.getElementById("admin").classList.add("hidden");
renderProducts();
renderCart();
}

// Show admin
function showAdmin(){
document.getElementById("shop").classList.add("hidden");
document.getElementById("admin").classList.remove("hidden");
renderAdmin();
}

// Add product
function addProduct(){
let name = document.getElementById("pname").value;
let price = document.getElementById("pprice").value;

if(name && price){
products.push({name, price});
document.getElementById("pname").value = "";
document.getElementById("pprice").value = "";
renderAdmin();
renderProducts();
}
}

// Render products
function renderProducts(){
let list = document.getElementById("productList");
list.innerHTML = "";

products.forEach((p, i)=>{
list.innerHTML += `
<div class="card">
<b>${p.name}</b><br>
Price: $${p.price}<br>
<button onclick="addToCart(${i})">Add to Cart</button>
</div>
`;
});
}

// Add to cart
function addToCart(i){
cart.push(products[i]);
renderCart();
}

// Render cart
function renderCart(){
let c = document.getElementById("cart");
c.innerHTML = "";

cart.forEach((p)=>{
c.innerHTML += `<div class="card">${p.name} - $${p.price}</div>`;
});
}

// Admin products
function renderAdmin(){
let a = document.getElementById("adminProducts");
a.innerHTML = "";

products.forEach((p)=>{
a.innerHTML += `<div class="card">${p.name} - $${p.price}</div>`;
});
}

showShop();

</script>

</body>
</html>
