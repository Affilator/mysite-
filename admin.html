<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LUXEAMAZON — Protected Admin Terminal</title>
    <style>
        body { font-family: 'Segoe UI', system-ui, sans-serif; background-color: #f0f4f8; color: #1a202c; padding: 5px; margin: 0; }
        .wrapper { max-width: 900px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; }
        
        h2 { color: #131921; font-size: 28px; font-weight: 700; margin-bottom: 25px; padding-bottom: 12px; border-bottom: 3px solid #febd69; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: #e67e22; color: white; font-size: 12px; padding: 4px 12px; border-radius: 20px; font-weight: normal; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
        .full-width { grid-column: 1 / -1; }
        
        label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #4a5568; }
        input { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
        input:focus { outline: none; border-color: #4299e1; box-shadow: 0 0 0 3px rgba(66,153,225,0.15); }
        
        .submit-btn { background: #2b6cb0; color: white; border: none; padding: 14px; width: 100%; cursor: pointer; font-weight: 700; font-size: 16px; border-radius: 6px; transition: background 0.2s; }
        .submit-btn:hover { background: #2c5282; }

        .table-section { margin-top: 40px; }
        .table-section h3 { font-size: 20px; margin-bottom: 15px; color: #2d3748; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f7fafc; color: #4a5568; font-weight: 600; }
        
        .row-img { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 1px solid #edf2f7; }
        .delete-action { background-color: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .delete-action:hover { background-color: #f5c6c6; color: #742a2a; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Internal Control Dashboard <span class="badge">Live Admin</span></h2>
    
    <div class="form-grid">
        <div class="full-width">
            <label>Product Title / Name</label>
            <input type="text" id="itemName" placeholder="e.g. Minimalist Leather Wallet">
        </div>
        <div>
            <label>Retail Price ($ USD)</label>
            <input type="number" id="itemPrice" placeholder="e.g. 89">
        </div>
        <div>
            <label>Product Image Link (URL)</label>
            <input type="text" id="itemImg" placeholder="Paste link (or leave blank for default image)">
        </div>
    </div>
    <button class="submit-btn" onclick="pushToStore()">Publish Live to Storefront</button>

    <div class="table-section">
        <h3>Active Active Stock Management</h3>
        <table>
            <thead>
                <tr>
                    <th>Visual</th>
                    <th>Product Title</th>
                    <th>Price</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="inventory-rows"></tbody>
        </table>
    </div>
</div>

<script>
    const fallbackSeed = [
        { id: 201, name: "Premium Onyx Chronograph Watch", price: 349, img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
        { id: 202, name: "Aviator Titanium Sunglasses", price: 185, img: "https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=500" }
    ];

    let storeStock = JSON.parse(localStorage.getItem('shared_store_stock')) || fallbackSeed;

    function refreshAdminTable() {
        const tbody = document.getElementById('inventory-rows');
        tbody.innerHTML = '';

        if(storeStock.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#a0aec0; padding:20px;">No items registered. Core database is empty.</td></tr>`;
            return;
        }

        storeStock.forEach(product => {
            tbody.innerHTML += `
                <tr>
                    <td><img class="row-img" src="${product.img}" onerror="this.src='https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500'"></td>
                    <td><strong>${product.name}</strong></td>
                    <td style="color:#2b6cb0; font-weight:700;">$${product.price}</td>
                    <td><button class="delete-action" onclick="killItem(${product.id})">Remove Product</button></td>
                </tr>
            `;
        });
    }

    function pushToStore() {
        const title = document.getElementById('itemName').value.trim();
        const cost = document.getElementById('itemPrice').value.trim();
        let graphic = document.getElementById('itemImg').value.trim();

        if(!title || !cost) {
            alert("Error: Title and Price are mandatory inputs.");
            return;
        }
        
        if(!graphic) {
            graphic = "https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500";
        }

        const newProduct = {
            id: Date.now(),
            name: title,
            price: parseFloat(cost),
            img: graphic
        };

        storeStock.push(newProduct);
        localStorage.setItem('shared_store_stock', JSON.stringify(storeStock));
        refreshAdminTable();

        // فورم خالي کول
        document.getElementById('itemName').value = '';
        document.getElementById('itemPrice').value = '';
        document.getElementById('itemImg').value = '';
        alert("Success: New product broadcasted to client storefront.");
    }

    function killItem(targetId) {
        if(confirm("Are you sure you want to delete this product?")) {
            storeStock = storeStock.filter(item => item.id !== targetId);
            localStorage.setItem('shared_store_stock', JSON.stringify(storeStock));
            refreshAdminTable();
        }
    }

    // لومړی چلول
    refreshAdminTable();
</script>
</body>
</html>
